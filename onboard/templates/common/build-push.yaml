# Generated by rssb-infra/onboard. After a merge into develop/qa/main:
#   develop: build (amd64 + arm64), Trivy gate, push to GHCR, Cosign sign -> UAT
#   qa/main: reuse the image built on develop (matched by git tree hash)
# then record the tag in the config repo; Argo CD deploys it.
name: Build and publish

on:
  push:
    branches: [develop, qa, main]

permissions:
  contents: read

concurrency:
  group: build-push-${{ github.ref }}
  cancel-in-progress: false

env:
  APP_NAME: __NAME__
  CONFIG_REPO: __CONFIG_REPO__
  TRIVY_IMAGE: aquasec/trivy:0.75.0

jobs:
  prepare:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      environment: ${{ steps.meta.outputs.environment }}
      image: ${{ steps.meta.outputs.image }}
      build: ${{ steps.check.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: meta
        run: |
          tree=$(git rev-parse 'HEAD^{tree}')
          case "$GITHUB_REF_NAME" in
            develop) env=uat ;; qa) env=staging ;; main) env=production ;;
          esac
          {
            echo "tag=tree-${tree:0:12}"
            echo "environment=$env"
            echo "image=ghcr.io/${GITHUB_REPOSITORY,,}"
          } | tee -a "$GITHUB_OUTPUT"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: check
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          if docker buildx imagetools inspect "$IMAGE:$TAG" > /dev/null 2>&1; then
            echo "build=false" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_REF_NAME" = develop ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::No image for $TAG. Code must reach $GITHUB_REF_NAME through develop (UAT) first."
            exit 1
          fi

  build:
    needs: prepare
    if: needs.prepare.outputs.build == 'true'
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: scan/app:ci
          cache-from: type=gha,scope=app-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=app-${{ matrix.arch }}
      - name: Trivy gate (CRITICAL blocks the publish)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD/.trivyignore:/.trivyignore:ro" "$TRIVY_IMAGE" image \
            --ignorefile /.trivyignore --ignore-unfixed --severity CRITICAL \
            --exit-code 1 scan/app:ci
      - id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          outputs: type=image,name=${{ needs.prepare.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=app-${{ matrix.arch }}
      - run: |
          mkdir -p "$RUNNER_TEMP/digests"
          digest="${{ steps.push.outputs.digest }}"
          touch "$RUNNER_TEMP/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests_${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          retention-days: 1

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      IMAGE: ${{ needs.prepare.outputs.image }}
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digests_*
          merge-multiple: true
          path: ${{ runner.temp }}/digests
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Create multi-arch tag
        working-directory: ${{ runner.temp }}/digests
        run: |
          # shellcheck disable=SC2046
          docker buildx imagetools create -t "$IMAGE:$TAG" -t "$IMAGE:sha-${GITHUB_SHA:0:7}" \
            $(printf "$IMAGE@sha256:%s " *)
      - name: Sign with Cosign (keyless)
        run: |
          digest=$(docker buildx imagetools inspect "$IMAGE:$TAG" --format '{{json .Manifest}}' | jq -r .digest)
          cosign sign --yes "$IMAGE@$digest"

  promote:
    needs: [prepare, publish]
    # Promote only an image that exists: reused (build == false) or freshly
    # published. "publish skipped" alone also happens when the BUILD FAILED.
    if: always() && needs.prepare.result == 'success' && (needs.prepare.outputs.build == 'false' || needs.publish.result == 'success')
    runs-on: ubuntu-24.04
    env:
      ENVIRONMENT: ${{ needs.prepare.outputs.environment }}
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.CONFIG_REPO }}
          ssh-key: ${{ secrets.CONFIG_REPO_DEPLOY_KEY }}
          path: config
      - name: Write the image tag
        working-directory: config
        run: |
          case "$ENVIRONMENT" in uat) s=uat ;; staging) s=staging ;; production) s=prod ;; esac
          sed -i -E "s|^(  tag: )[^ ]+|\1$TAG|" "apps/$APP_NAME/values-$s.yaml"
      - name: Commit and push
        working-directory: config
        env:
          SOURCE: ${{ github.repository }}@${{ github.sha }}
        run: |
          git diff --quiet && { echo "Already at $TAG in $ENVIRONMENT."; exit 0; }
          git config user.name "rssb-ci-bot"
          git config user.email "rssb-ci-bot@users.noreply.github.com"
          git commit -qam "Deploy $APP_NAME $TAG to $ENVIRONMENT" -m "Source: $SOURCE"
          if [ "$ENVIRONMENT" = production ]; then
            git push -f origin "HEAD:refs/heads/promote/production/$APP_NAME-$TAG"
          else
            for attempt in 1 2 3 4 5; do
              git push origin HEAD:main && break
              sleep $((attempt * 3)); git pull --rebase -q origin main
            done
          fi
